deine_nachricht: "Hallo ihr Lieben,\r\n\r\nwir sind eine Gruppe von 5 Freundinnen und einem Baby und würden gerne bei Euch übernachten. Das ist ein Geschenk für eine der Freundinnen. Ich war schon häufiger bei Euch zu Gast, einmal auch über Nacht und würde mir wünschen, dass die anderen auch diesen schönen Ort kennen lernen. Leider ist es uns nur möglich eine Nacht zu bleiben. Ich weiß, dass ist am Wochenende eigentlich nicht vorgesehen, aber ich wollte die Nachfrage nicht unversucht lassen. Am liebsten würden wir in die Appartements, sollten diese noch frei sein. \r\nIch freue mich über eine Rückmeldung.\r\n\r\nLiebe Grüße, \r\nLina"
