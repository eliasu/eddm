deine_nachricht: "Moin liebes Team der Möglichkeiten,\r\n\r\nschon eine Weile beobachte ich mit Interesse euer Projekt. Für dieses Jahr suche ich noch eine Location für meine Freundin und mich, um die Sternenschauer zu beobachten. Gern würden wir daher bei euch vorbeikommen und den Sternenhimmel bewundern.\r\n\r\nIch weiß nicht genau, wie das läuft … Arbeitsplätze: Tagsüber müssen wir leider arbeiten. Gibt es dafür irgendwo Plätze / Spaces? Muss man diese dazu buchen?\r\n\r\nVerpflegung: Gibt es bei euch die Möglichkeit, sich selbst zu verpflegen?\r\n\r\nDie Zimmer 112 und 114 klangen schön. Sind die noch frei in dem Zeitraum?\r\n\r\nFreue mich über eine Rückmeldung.\r\n\r\nLiebe Grüße aus Hamburg,  \r\nAlessandro"
