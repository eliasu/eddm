deine_nachricht: "Liebes EinDingDerMöglichkeit-Team, \r\n\r\nmein Name ist Julia, ich bin 40 Jahre alt und habe im vergangenen Jahr meinen Master in der Freien Bildenden Kunst in Ottersberg gemacht.  \r\n\r\nEine ganze Weile möchte ich mich eigentlich schon bei euch für einen Aufenthalt bewerben, aber weil mein Portfolio noch nicht so „richtig fertig“ ist, habe ich es noch aufgeschoben. \r\n\r\nJetzt melde ich mich dennoch, weil ich ein bisschen in Not geraten bin.\r\n In meiner aktuellen Wohnung in Ottersberg ist es leider zu einem massiven Schimmelbefall gekommen und ich muss aus gesundheitlichen Gründen schnellstmöglich die Wohnung verlassen. \r\n\r\nDeshalb wollte ich einfach mal leise anklopfen und fragen, ob es bei euch vielleicht in der kommenden Zeit einen freien Raum geben könnte. \r\n\r\nIch würde mich riesig freuen, von euch zu hören und euch gerne auch ein bisschen mehr zu mir und dem, was ich so mache, zeigen. \r\n\r\nErst einmal herzliche Grüße aus Otti, \r\nJulia"
