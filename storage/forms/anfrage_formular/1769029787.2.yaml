deine_nachricht: "Liebes Ein Ding der Möglichkeit Team,\r\n\r\nich bin im letzten Jahr 30 Jahre alt geworden und würde das gerne bei einem Wochenende in der Natur mit den Frauen nachfeiern, die mich täglich inspirieren und in den letzten drei Jahrzehnten geprägt haben. Wir wollen Lagerfeuer machen, lesen, spazieren gehen, basteln und einfach gemütlich zusammensein. Dafür habe ich sofort an euch gedacht! Ist euer Apartment mit den drei Doppelbetten vom 24. bis 26. April noch verfügbar? Und könnte man da noch ein Bett hinzufügen, damit Platz für 7 Leute ist? Das wäre fantastisch. \r\n\r\nIch freue mich sehr, von euch zu hören und wünsche euch einen wunderbaren Donnerstag morgen, \r\nIda"
