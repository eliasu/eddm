deine_nachricht: "Hallo liebes Team von ein Ding der Möglichkeit,\r\nWir suchen für unser queeres Körperarbeits- und Kink-Seminar einen seminar-Raum (Yoga-ähnlich), kleiner Küche und übernachtungsmöglichkeit, wobei manche von uns auch im Seminarraum oder mit Auffbettung schlafen könnten.\r\nWichtig ist für uns ungestörtheit und die privatathmosspäre im Seminarraum. Bei schlafplatz und Bad sind wir unkompliziert und nehmen was frei ist. \r\nWir kochen selbst.\r\nWir haben begrenzte finanzielle Möglichkeiten und würden uns freuen wenn ihr uns die günstigste Möglichkeit für den genannten Zeitraum (Anreise 19. bis Abreise am 23. März) sagen könnt.\r\nLiebe Grüße\r\nSimon"
