deine_nachricht: "Hallo liebe Julia,\r\n\r\nwie mit Peggy telefonisch abgesprochen sende ich hiermit die Anfrage für ein Seminar, dass meine Frau und ich im Februar 2027 veranstalten werden.\r\n\r\nWir interessieren uns für eure Location und würden gerne wissen, ob ihr im genannten Zeitraum Kapazitäten habt und die genauen Konditionen dazu erfragen.\r\n\r\nEs werden ca. 12 bis 16 Teilnehmer sein (also ca. 6-8 DZ). Wir sind zwei Seminarleiter und haben einen kleinen Sohn dabei, sowie Großeltern, die uns bei seiner Betreuung unterstützen.\r\n\r\nWir benötigen einen Raum von ca. 100m^2, Yogamatten, Kissen und Decken, sowie die Möglichkeit Musik abzuspielen.\r\n\r\nIch und wir freuen uns von euch zu hören und senden liebe aus Nindorf!\r\n\r\nGeorg und Mirjam"
