deine_nachricht: "Liebe Hofgemeinschaft,\r\n\r\nich bin dieses Jahr zum ersten Mal mit lieben Freundinnen bei der Kulturellen Landpartie dabei, worauf ich mich schon sehr freue und gespannt bin:) Eure Angebote klingen auch voll toll!\r\n\r\nDamit ich am Donnerstag schon ganz ins vielseitige Programm eintauchen kann, würde ich gerne schon am Mittwoch ins Wendland anreisen und möchte euch fragen, ob bei euch die Möglichkeit bestünde, von Mittwoch auf Donnerstag zu zelten? Wahrscheinlich für 2 Personen in 2 Zelten. \r\n\r\nUnd sollten wir danach gerne noch eine weitere Nacht bei euch bleiben wollen, wäre das auch möglich und können wir das spontan entscheiden?\r\n\r\nKostet die Übernachtung im Zelt bei euch was?\r\n\r\nZu Duschen habe ich leider bisher nichts auf der Seite der KLP gefunden:( Wäre das bei euch möglich und schließt es sogar Duschen mit ein, wenn es eine ausgewiesene Campingmöglichkeit gibt?\r\n\r\nDanke im Vorhinein fürs Beantworten meiner vielen Fragen:) Ich freue mich auf eure Antwort:) Und die diesjährige KLP;)\r\n\r\nVorfreudige Grüße\r\nRia"
