deine_nachricht: "Hallo zusammen, ich bin Yogalehrerin in der Altmark und bilde seit letztem Jahr auch YogalehrerInnen aus. Für unsere \"Abschlussfahrt\" im September nächsten Jahres, suchen wir noch einen geeigneten Ort für etwas Rückzug und natürlich auch noch ein wenig Yogapraxis ;-) Über eine Bekannte bin ich auf Sie gestoßen und wollte fragen, ob wir im oben genannten Zeitraum zu Ihnen kommen könnten?\r\nWir würden 8 Einzelzimmer aber mit jeweils eigenem Bad benötigen und einen Raum, an dem wir etwas ungestört unserer Yogapraxis nachgehen können (auch Meditation). Gern würden wir im oben genannten Zeitraum auch eine vegetarische Versorgung in Anspruch nehmen. Das Frühstück könnten wir uns sonst auch selber Anrichten wenn es eine Küche gibt...? Ansonsten wären wir dankbar für ein Abendessen am Donnerstag, einen Brunch und ein Abendbrot am Freitag, ein Abendbrot am Samstag und ein Frühstück am Sonntag. \r\nEs wäre ganz wunderbar, wenn Sie uns ein Angebot erstellen könnten, sodass ich mit meinen Schülern sprechen kann. \r\nVielen Dank!\r\nHerzliche Grüße\r\nClaudia Mohrmann"
