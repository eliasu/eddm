deine_nachricht: "Liebes Team vom \"Ein Ding der Möglichkeit\",\r\n\r\nwir sind Carsten (42) und Lena (36), und nach 10 gemeinsamen Jahren wollen wir im nächsten Jahr heiraten und mit unseren Liebsten das Leben und die Liebe feiern.\r\n\r\nDa wir beide den Spätsommer lieben, würden wir uns gern Ende August oder im September das Ja-Wort geben. Als leidenschaftliche Festival-Besucher:innen lässt besonders der Gedanke einer Hochzeit im Festival-Stil unsere Herzen schon jetzt höher schlagen: ein unbeschwerter Tag und Abend voller Freude, Lachen, Tanz und gemeinsamer Zeit. Am liebsten verbunden mit der Möglichkeit, direkt vor Ort zu übernachten, sei es im Camper, im Zelt oder in Euren hauseigenen Räumlichkeiten.\r\n\r\nAktuell planen wir mit ca. 60–70 Gäst:innen. \r\n\r\nAuf Empfehlung einer lieben Freundin, die schon einmal bei Euch zu Gast war und so sehr geschwärmt hat, sind wir auf Eure Location gestoßen und waren ebenfalls allein von den Bildern und Eurer Website total begeistert. \r\n\r\nDa wir in Eurem Veranstaltungskalender gesehen haben, dass der 11./12.09.2026 noch frei ist, stell sich uns zuerst die Frage: Sind Hochzeiten denn grundsätzlich \"ein Ding der Möglichkeit\" bei Euch? 😊 Und falls ja, wäre der 11./12.09. dafür denkbar oder gibt es vielleicht sogar noch weitere Termine, die für uns in Frage kämen?\r\n\r\nSollte das der Fall sein, würden wir uns sehr freuen, Euch persönlich kennenzulernen und bei einem Besuch vorbeizuschauen. Falls möglich, wären wir Euch auch für eine erste Übersicht zu den Kosten dankbar, damit wir eine bessere Vorstellung bekommen.\r\n\r\nVielen Dank schon einmal für Eure Rückmeldung. Wir sind sehr gespannt und freuen uns! :)\r\n\r\nLiebe Grüße aus Hamburg\r\nCarsten & Lena"
