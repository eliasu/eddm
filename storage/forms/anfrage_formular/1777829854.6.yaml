deine_nachricht: "Hallo,\r\n\r\nwir sind zwei Familien – also zwei Mütter mit jeweils zwei Kindern – und würden sehr gern während der Kulturellen Landpartie bei euch übernachten.\r\n\r\nDeshalb wollten wir fragen, ob bei euch noch etwas frei ist. Besonders interessieren würden uns ein oder zwei Zirkuswagen, falls verfügbar. Alternativ wären auch Zimmer für uns eine schöne Option.\r\n\r\nFalls beides schon vergeben ist: Besteht die Möglichkeit, mit einem Camper bei euch auf dem Zeltplatz zu stehen?\r\n\r\nWir würden uns sehr über eine Rückmeldung freuen.\r\n\r\nLiebe Grüße\r\nNicole Piechota"
