deine_nachricht: "Dear Ein Ding der Möglichkeit team,\r\n\r\nWe at MOIA are planning a two-day training and would like to host it externally. We are very interested in your location and believe it could be a great fit for our event.\r\n\r\nThe training is planned for 17–18 June 2026. Guests would arrive at 10:00 on the first day, and the training would end at 17:00 on the second day.\r\n\r\nFor this setup, we would require the following:\r\n\r\nA larger conference room for 27 people on both days, equipped with the necessary technical equipment for presentations and training sessions\r\nOne additional smaller conference room on both days to serve as a breakout room\r\nAccommodation for one night for 27 people\r\nThe option for employees to book the night before, should they wish to arrive early\r\nCatering during the training, as well as breakfast and dinner for all participants\r\nFirst day: full-day conference package plus dinner\r\nSecond day: full-day conference package\r\nCould you please let us know whether you have availability for either of these dates and whether you can accommodate the above requirements?\r\n\r\nIf so, would it be possible to make a temporary reservation for the hotel rooms and seminar rooms until a certain date, by which we can provide final confirmation of the number of attendees?\r\n\r\nKind regards,\r\nVictoria"
