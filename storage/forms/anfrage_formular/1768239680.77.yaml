deine_nachricht: "Liebes Team, \r\nfür das Projekt „LOKAL“ planen wir in Kooperation mit der Kulturstiftung des Bundes und in Zusammenarbeit mit der European Cultural Foundation und der John Dewey Forschungsstelle für die Didaktik der Demokratie derzeit eine Tagungsveranstaltung am 11.-13.5.2026 (Anreise teils am 10.5.) und würden gerne zum einen Ihre Kapazitäten erfragen sowie nach einer unverbindlichen Kosteneinschätzung für die Nutzung von Räumlichkeiten sowie gerne auch Verpflegungs- und Übernachtungsmöglichkeiten. \r\n \r\nDie Eckdaten der Veranstaltung:\r\n \r\n•             Teilnehmerzahl: ca. 40–45 Personen\r\n•             Zeitrahmen: ganztägig am 11.+12.5. sowie halbtägig am 13.5.\r\n•             Raumwünsche: einen größeren Raum sowie mehrere Gruppenräume oder draußen Aufenthaltsmöglichkeiten für parallele Arbeitsphasen\r\n•             Optional: Informationen zu Verpflegungsangeboten (z. B. Kaffee, Mittagessen, Snacks) sowie Übernachtungsmöglichkeiten für die Teilnehmenden\r\n \r\nWir freuen uns auf Ihre Rückmeldung.\r\n \r\nFreundliche Grüße\r\nPaula Siemes"
