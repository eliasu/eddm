deine_nachricht: "Sehr geehrte Damen und Herren,\r\n\r\ndas Kompetenzzentrum Kommunale Konfliktberatung plant derzeit eine Teamklausur, die vom 01.12.-02.12.2025 stattfinden soll, und ist auf der Suche nach einem geeigneten Tagungsort. Wir würden uns freuen, wenn Sie uns ein Angebot für die folgenden Anforderungen unterbreiten könnten:\r\n\r\n-Teilnehmerzahl: Wir sind ein Team von 19 Personen. Diese sollen in Einzelzimmern (oder alternativ in Doppelzimmern zur Einzelnutzung) untergebracht werden. \r\n-Raumbedarf: Wir benötigen einen großen Raum, in dem wir als Gruppe zusammenkommen können. Dieser Raum soll groß genug sein, um auch in Kleingruppen zu arbeiten. Alternativ benötigen wir zusätzlich einen kleinen Raum für Gruppenarbeiten. \r\n\r\nDa wir aktuell noch nicht sicher sind, ob die Verpflegungskosten übernommen werden oder von den Mitarbeitenden selbst getragen werden, bitten wir Sie, die Verpflegungskosten separat aufzuführen.\r\n\r\nFalls Sie an diesem Zeitraum noch Kapazitäten haben, würden wir uns über ein entsprechendes Angebot sehr freuen. Für Rückfragen stehe ich Ihnen gerne per E-Mail oder telefonisch unter 0151 42042386 zur Verfügung.\r\n\r\nVielen Dank im Voraus und freundliche Grüße\r\n\r\nLuisa Biasotto"
