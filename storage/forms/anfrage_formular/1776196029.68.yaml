deine_nachricht: "Hallo -\r\nhier schreibt Lisa aus Diahren. Diesmal als Mutter aus dem Waldkindergarten Wakiwa. \r\nWir (zwei Eltern des Kindergartens) haben bei der Gemeinde Waddeweitz Gelder für Demokratieförderung beantragt und wollen damit für das Team wie die Eltern des Kindergartens einen 2 stündigen Workshop zur Sensibilisierung von Rassismus im Kontext Kindergarten mit zwei Referentinnen anbieten. \r\n\r\nUnd weil ihr sooo schöne Räume habt, fragen wir Euch an. \r\nUnter welchen Bedingungen könnt, wollt ihr was anbieten?\r\nDer Workshop würde an einem der Montage, wird sich von uns aus noch entscheiden, von 17-19 Uhr stattfinden. Sobald die Finanzierung durch die Gemeinde Waddeweitz steht. \r\n\r\nMit besten Grüßen aus Diahren, \r\nLisa."
