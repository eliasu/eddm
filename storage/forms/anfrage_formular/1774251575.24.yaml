deine_nachricht: "Liebe Julia,\r\n\r\nwie vorletztes Wochenende kurz angesprochen, würden meine Schwester und ich unseren 30. Geburtstag sehr gerne ein Wochenende lang bei euch auf dem Hof feiern. \r\nDa der Geburtstag auf einen Freitag fällt, würden wir gerne das Wochenende vom 19.-21.03.2027 mit Freunden und Familie bei euch verbringen. \r\n\r\nUnsere Gästeliste ist aktuell noch in Abstimmung und fällt eher größer aus. Realistisch würden wir uns aktuell im Bereich von etwa 40–60 Personen bewegen, wären aber grundsätzlich auch flexibel und könnten die Runde bei Bedarf kleiner halten.\r\n\r\nDaher wollte ich zunächst einmal fragen, ob das Wochenende grundsätzlich möglich wäre und wie viele Personen auf dem Hof für zwei Übernachtungen untergebracht und gut verpflegt werden könnten. \r\n\r\nIch freue mich über eine kurze Rückmeldung und wünsche dir einen guten Start in die Woche! \r\n\r\nBeste Grüße \r\nMegan"
