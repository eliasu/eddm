deine_nachricht: "Hallo aus Hannover!\r\nSchon vor längerer Zeit hat mir Stephan Wichert-von Holten (evangelischer Propst im Wendland) einen Aufenthalt auf Ihrem Hof empfohlen. Und jetzt gibt es endlich auch einen Anlaß:\r\nVom 9.-11. Dezember 2025 möchte wir - zwei Referenten im Dienst der Evangelischen Landeskirche Hannovers (für Sozialraumorientierung und Gemeinwesendiakonie) -  drei konzentrierte Klausurtage durchführen.\r\nDafür benötigen wir möglichst zwei Einzelzimmer incl. Verpflegung und einen kleinen Tagungsraum für die drei Tage. Wir würden gerne am Vormittag des 9.12. beginnen und am Abend des 11.12. schließen.\r\nWichtig für die Ausstattung des Tagungsraumes ist v.a. eine stabile WLAN-Verbindung, da wir uns in diesen Tagen mit einigen Kolleg*innen digital austauschen wollen. Weiter wären ein Flipchart und/oder eine Moderationswand hilfreich.\r\nDie Informationen reichen hoffentlich zunächst einmal für diese Voranfrage.\r\nÜber eine Rückmeldung, ob es eine Chance gibt, unsere Klausurtage vom 9.-11.12.2025 bei Ihnen durchzuführen, wäre ich Ihnen sehr dankbar.\r\nMit besten Grüßen und guten Wünschen,\r\nHolger Nollmann"
