deine_nachricht: "Liebes Team von Ein Ding der Möglichkeit, \r\n\r\nim kommenden Jahr planen wir ein längeres Wochenendretreat zum Thema Visionsbildung und Kreativität und sind auf eure wundervollen Räumlichkeiten aufmerksam geworden. Wir planen mit ca. 15 Personen an dem Retreat teilzunehmen + 2 Coaches. Dafür interessieren wir uns sehr, ob Sie bereits Erfahrung mit Retreats (solcher Art) haben und ob es von Ihrer Seite gewollt ist. Gerne würden wir auch einen ungefähren preislichen Voranschlag erfahren, z.B. mit Halbpension, Räumlichkeiten und Übernachtungspreisen. \r\n\r\nGerne können wir auch hierzu einmal kurz telefonieren, das wäre sicher einfacher. \r\n\r\nIch freue ich von Ihnen zu hören. \r\n\r\nViele liebe Grüße und einen schönen Tag \r\nElisa Schmidt"
