deine_nachricht: "Hallo liebes Ding der Möglichkeit-Team,\r\n\r\nvor etwa zwei Jahren waren wir schon einmal mit unserem Team bei euch zu Gast – es hat uns damals super gefallen!\r\nIm nächsten Jahr möchten wir gerne wieder einen Wochenend-Workshop bei euch durchführen und wollten anfragen, ob ihr in dem Zeitraum noch Kapazitäten habt.\r\n\r\nWir bräuchten Übernachtungsmöglichkeiten für etwa 15–18 Personen (die genaue Zahl kann ich euch noch nachreichen).\r\nGeplant wäre die Anreise am Freitag. Es wäre großartig, wenn wir an dem Tag Mittag- und Abendessen bekommen könnten.\r\nAm Samstag würden wir uns über Frühstück, Mittag- und Abendessen freuen, und am Sonntag dann noch ein leckeres Frühstück vor der Abreise.\r\n\r\nReichen euch diese Infos fürs Erste?\r\n\r\nLiebe Grüße\r\nMiriam von LYNX Media Systems"
