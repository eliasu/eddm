deine_nachricht: 'Hallo liebes Team, wir werden als einer der Akteure im Kreis Stendal mit unserem Projekt "Gutleben Büttnershof" an der Regionalkonferenz teilnehmen und würden gerne bei der Gelegenheit Euer Haus auch etwas besser kennenlernen. Leider haben wir gesehen, dass Euer Haus zu dem Termin schon belegt ist. Wir benötigen zwei separate Räume, d.h. z.B. ein Apartment mit zwei Schlafräumen wäre perfekt. In der Hoffnung, dass doch noch was frei ist, herzliche Grüße Wolf + Maike'
