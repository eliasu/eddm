deine_nachricht: "Moin :-)\r\n\r\nWir sind Bilge und Moritz und würden gerne in eurer wunderschönen Unterkunft übernachten (Wir hatten uns bereits gestern und heute per Mail und Telefon freundlich mit euch austauschen dürfen.) Wir würden gerne am 18.9. ankommen und am 22.9. (vor 11 uhr) wieder auschecken. \r\nAls Zimmer würden wir gerne ein Doppelzimmer mit eigenem Bad (und wenn noch da, Balkon) buchen. Wir nehmen gerne das Müsli-Frühstück in Anspruch und klinken uns Samstag und Sonntag gerne beim Abendessen der von euch beschriebenen Seminargruppe ein. \r\n\r\nDarüber hinaus würden wir gerne wissen, ob es vielleicht möglich wäre, sich zwei Fahrräder von euch oder in der Nähe auszuleihen?\r\nWir freuen uns von euch zu hören!\r\n\r\nLiebe Grüße,\r\nBilge und Moritz"
