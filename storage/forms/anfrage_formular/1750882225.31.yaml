deine_nachricht: "Liebe Luftschlossbauer,\r\nDurch den Meuchefitzer Hof habe ich von euch erfahren und würde sehr gerne mit meiner Schwester und meinem Papa eine Woche bei euch verbringen. Wir fahren ins Wendland, auf der Suche nach aktiven Gemeinschaften und netten biodynamischen/handwerklichen Ausbildungsbetrieben. Es würde uns sehr freuen, wenn bei euch in dieser Zeit noch Zimmer frei sind und wir von euch aus die Gegend erkunden könnten. Wir freuen uns auf eure Rückmeldung! \r\nLiebe Grüße,\r\nAntonia"
