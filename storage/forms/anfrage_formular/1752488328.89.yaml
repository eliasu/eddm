deine_nachricht: "Hallo, \r\nich hatte gerade schon telefonisch angefragt. Für eine Steuerungsgruppensitzung der Zukunftsregion Elbtalaue-Heide-Wendland benötigen wir einen Sitzungsraum mit folgender Ausstattung:\r\n- Tische und Stühle (eher klassische Konferenzbestuhlung, z.B. U-Form oder ähnliches)\r\n- Beamer\r\n- Leinwand\r\n- je nach Akustik im Raum wäre ggf. noch ein Mikro gut\r\n- die Räumlichkeiten müssten barrierefrei zugänglich sein\r\n- An Verpflegung benötigen wir Kaffee, Tee und alkoholfreie Kaltgetränke, wenn für euch möglich, würden wir diese gerne nach Verbrauch abrechnen. Dazu noch belegte Brötchen oder ähnliches, gerne vegan/vegetarisch. \r\n\r\nDie Sitzung ist von 14.00 - 17.00 Uhr angesetzt, eine größere Pause ist nicht geplant. Um die Sitzung vorzubereiten, wäre unser Team etwa eine Stunde vor Beginn vor Ort. \r\n\r\nBitte adressiert das Angebot an folgende Adresse: \r\n\r\nLandkreis Lüchow-Dannenberg\r\nStabsstelle Regionale Entwicklungsprozesse\r\nZukunftsregion Elbtalaue-Heide-Wendland\r\n\r\nKönigsberger Straße 10\r\n29439 Lüchow (Wendland)\r\n\r\nHerzlichen Dank!\r\nFelicia Harms"
