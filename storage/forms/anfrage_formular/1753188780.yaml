deine_nachricht: "Hallo zusammen, \r\nauf der Suche nach einer schönen und nicht so steifen Location für unser Leadership Team-Retreat vom 14. April 2026 (Start ca. 12 Uhr) bis zum 15. April 2026 (Ende um ca. 16 Uhr) bin ich auf euch gestoßen😊.\r\n\r\nWir würden uns freuen, wenn ihr zum genannten Termin noch Kapazitäten frei habt und uns ein entsprechendes Angebot per E-Mail zukommen lasst. \r\n                                                                                                                                                                             \r\nHier noch ein paar Eckdaten – gewünscht/benötigt wird:\r\n\r\n- ein Meetingraum für 16 Teilnehmer:innen an beiden Tagen mit Beamer, Flipchart und Metaplanwand\r\n\r\n- Verpflegung am Dienstag: Light Lunch oder Fingerfood (gerne vegetarisch) bei Ankunft, gesunde Snacks am Nachmittag im Meetingraum, Abendessen (gerne mit vegetarischer Option)\r\n\r\n- Verpflegung am Mittwoch: Frühstück, gesunde Snacks im Meetingraum, Light Lunch (gerne mit vegetarischer Option)\r\n\r\n- Übernachtung für 16 Personen, optimalerweise mit vielen Einzelmöglichkeiten\r\n\r\nIch freue mich auf eure Rückmeldung und sage vorab lieben Dank!\r\n\r\nHerzliche Grüße aus dem Fürstenberg Institut\r\nNicole"
