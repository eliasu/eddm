deine_nachricht: "Hallo, \r\nwir sind ein Softwareentwicklungsunternehmen aus Hamburg und suchen nach einer Location für unsere Offsite vom 24.-28.08.26, alternativ 21.-25.9.26. \r\nIst auf eurem Hof in der Zeit etwas verfügbar?\r\n\r\nWir sind ungefähr 11 Personen und benötigen 9-11 Schlafräume. Außerdem mindestens einen, eher zwei Räume zum gemeinsamen Arbeiten, mit Platz für Laptops und Monitore. \r\n\r\nWir möchten uns selbst versorgen. Steht eine große und gut ausgestattete Küche zur Verfügung?\r\n\r\n\r\nWir brauchen stabiles und schnelles Internet. Wie genau seid ihr da aufgestellt?\r\n\r\nGerne würden wir auch ein gemeinsames Teamevent planen - und sind offen für Vorschläge. \r\n\r\nKönnt ihr mir bitte ein unverbindliches Angebot erstellen? \r\n\r\nHerzliche Grüße\r\nFanny Gruhl\r\ncc.systems"
