deine_nachricht: "Hallo, wir wurden von Kolleg:innen auf euer schönes Haus aufmerksam gemacht. Wir sind auf der Suche nach einem guten Ort für unsere Teamtage vom 21.-22.01.2026.\r\nWir sind ein Team von 12 Menschen und bräuchten neben der einen Übernachtung einen ausgestatteten Seminarraum, einen Ort um abends noch zusammen zu sitzen und Verpflegung. Wir würden gern von Mittwoch ca 10 Uhr bis Donnerstag 17 Uhr tagen können. \r\nWäre zu diesen Tagen etwas bei euch frei? \r\nWir haben etwas begrenzte Budget-Kapazitäten, vor allem was die Verpflegungspauschalen angeht. Aber vielleicht finden wir da eine gute Konfiguration gemeinsam?\r\nWir freuen uns von euch zu hören.\r\nViele Grüße\r\nJael"
