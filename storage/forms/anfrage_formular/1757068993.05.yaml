deine_nachricht: "Achtung! Ich habe diese Anfrage aus Versehen auch über \"Gruppenhaus.de\" gestellt. Sie geht also evtl. doppelt bei Euch ein. Bitte entschuldigt.\r\n\r\nGuten Tag,\r\nwir sind sechs Frauen und möchten gerne das o.g. Wochenende bei Euch verbringen. Besteht die Möglichkeit 3 DZ zu buchen (Gerne die preiswertere Kategorie) oder evtl. auch die Remise? Wie groß sind die Doppelbetten in der Remise?\r\nEine Frau kommt nur eine Nacht, wie ist da die Preisgestaltung? Bzgl. Frühstück legen wir uns fest, wenn wir wissen, ob Ihr Kapazitäten für uns habt.\r\nWir freuen uns auf Eure Antwort!\r\nBeste Grüße,\r\nChristina König"
