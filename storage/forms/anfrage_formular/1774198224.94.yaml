deine_nachricht: 'Hallo liebes "Ein Ding der Möglichkeiten" Team. Meine Partnerin Pia (27) und ich Alex (34) wollten dieses Jahr zur Kulturellen Landpartie ins Wendland kommen. Euren Hof hab ich letzten Herbst im Rahmen einer Exkursion des Studiengangs Naturschutz und Landnutzungsplanung der Hochschule Neubrandenburg kennen lernen dürfen. Mich hat wirklich beeindruckt was ihr da so aufgebaut habt und der Vibe war auch unschlagbar. Da ich als Lüneburger meine Stralsunder Partnerin versuche von den Vorzügen des Wendlands zu überzeugen (ich würde nämlich in den nächsten Jahren gerne ins Wendland ziehen), dachte ich mir die KLP und euer Hofprojekt wären dafür perfekt. Also sofern ihr noch ein Zimmer oder Bauwagen frei haben solltet würden wir uns riesig freuen. Mit ganz herzlichen Grüßen Alex.'
