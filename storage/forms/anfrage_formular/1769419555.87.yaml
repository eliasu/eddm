deine_nachricht: "Moin! Ich habe euren Kontakt von meiner Freundin Hanna-Lena Autzen – sie hat mir so von Eurem Projekt vorgeschwärmt. Ich bin Neuro-Coach und für ein Retreat im Rahmen einer Mini-Mastermind von selbständigen Frauen suche ich einen Ort in der Natur, mit Sauna, Einzelzimmern, gutem Essen und einem Raum, der für das Arbeiten in der Gruppe genutzt werden kann. Es wäre schön, wenn wir als Gruppe auch relativ zurückgezogen sein könnten. Wäre das bei euch möglich?\r\nKönnt Ihr mir mehr Infos senden über Preise und Räume?\r\nDanke und liebe Grüße aus Bremen! Freu mich von euch zu hören. Anneli"
