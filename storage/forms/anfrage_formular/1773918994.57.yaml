deine_nachricht: "Liebes Team,\r\n\r\nIch plane ein Seminar mit einer Gruppe von etwa 15 bis 17 Personen und wollte anfragen, ob ihr im Zeitraum von Freitag, den 2. Oktober bis Sonntag, den 4. Oktober, noch Kapazitäten habt.\r\n\r\nKonkret würden wir Folgendes benötigen:\r\n\r\nidealerweise bis zu 17 Einzelzimmer\r\n\r\nVerpflegung von Freitagvormittag bis Sonntagmittag\r\n\r\neinen Seminarraum mit Tischen, Stühlen und stabilem WLAN\r\n\r\nDarüber hinaus habe ich noch zwei Fragen zum Rahmen:\r\nHabt ihr eine Feuerschale oder eine Möglichkeit, abends draußen gemeinsam zusammenzustehen?\r\nUnd besteht bei euch die Möglichkeit zum Eisbaden bzw. Zugang zum Wasser?\r\n\r\nIch freue mich sehr über eine Rückmeldung zu Verfügbarkeit und Konditionen.\r\n\r\nVielen Dank und herzliche Grüße aus Hamburg\r\nLena Wittneben"
