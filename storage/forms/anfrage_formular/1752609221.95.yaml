deine_nachricht: "Liebes Team vom Ding der Möglichkeit,\r\n\r\nich war letzten Sommer schon einmal bei euch zu Besuch – zusammen mit Agi, Elias, Stella und Kiran aus Berlin – und erinnere mich bis heute immer wieder an diese besondere, schöne Zeit bei euch.\r\n\r\nNun würde ich sehr gern mit fünf Freundinnen ein gemeinsames Wochenende bei euch verbringen – als eine Art Bonding-Auszeit. Wir würden in der Zeit gern eigene kleine Workshops untereinander gestalten, zusammen draußen sein, kochen, baden, die Sauna nutzen und einfach ein paar Tage in der Natur verbringen.\r\n\r\nWäre das grundsätzlich möglich? Wir wären ca. 5–8 Personen und sind zeitlich recht flexibel – idealerweise irgendwann an einem Wochenende im Oktober oder November. Falls es da schon recht kalt sein sollte, würden wir natürlich auch gerne Zimmer bei euch buchen. Was wäre denn da möglich?\r\n\r\nIch freue mich sehr auf eure Rückmeldung und hoffe, es klappt!"
