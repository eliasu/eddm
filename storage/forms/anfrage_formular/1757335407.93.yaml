deine_nachricht: "Hallo ihr lieben!\r\nIch bin auf der Suche nach einer Location für unsere Hochzeit in 2026 und kenne eure Location schon lange + für Hochzeiten seit der Hochzeit von Chris und Andrea im August 2024 - das war ein traum, den wir in ähnlicher Weise gern wiederholen würden. \r\n\r\nZu unseren Rahmendaten:\r\nWir wären, wenn alle Gäste zusagen, wovon ich nicht ausgehe, 81 erwachsene und 24 (klein)Kinder. Wir würden die Location gerne von Freitag bis Sonntag mieten, da wir Freunde und Familie aus ganz Deutschland haben. Wir wären sowohl nur an der reinen Location interessiert oder auch inkl essen und Getränke. Je nachdem was ihr so anbietet. Das hochzeitsdatum ist noch flexibel, von Mai-September wäre vieles möglich (außer mitte juni bis mitte juli). \r\nÜber eine Rückmeldung, gerne per Telefon, würde ich mich freuen. \r\n\r\nVielen dank und liebe Grüße \r\nKatrin Schultz"
