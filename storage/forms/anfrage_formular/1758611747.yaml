deine_nachricht: "Hallollooo, meine Name ist Julia, \r\n\r\nich möchte mich gerne als Aussteller auf eurem schönen Platz bewerben.\r\n\r\nDie letzten Jahre habe ich auf der Mützingenta mein kleines Modelabel  Universo Paralelo präsentiert.\r\nNun wird’s die Mützingenta ja leider zukünftig nicht mehr geben und somit suche ein neues kleines KLP zuhause.\r\n\r\nMein Zeugs ist ist alles von mir selbst entworfen und genäht. \r\nAus Ökostoffen. Alle Klamotten sind Unikate.\r\n\r\nIch schneider nun seit 10 Jahren und bin sehr glücklich über die altersunabhängige Resonanz auf der KLP. \r\nSchaut euch gerne mal an was ich so mache. Meine Mode ist schwer in Worte zu fassen.\r\n\r\n\r\nAuf meiner Homepage bekommt man einen kleinen Eiblick. \r\nAuf Instagram einen sehr großen Einblick von meiner Mode.\r\n\r\nwww.universo-paralelo.de\r\nInstagram: univers.o.paralelo\r\n\r\nMein Stand ist 3*3 Meter groß und bunt geschmückt. \r\nBei gutem Wetter und Platz arbeite ich mich auch gerne nach draußen raus.\r\n\r\nMit dabei habe ich auch (wenn gewünscht) meine Siebdruckplatten und Öko Glitzertattoos für jung und alt.\r\n\r\nSo wird mein Stand gern (mitmach) aktiv erlebt. \r\nUnd das macht mir großen Spaß.\r\n\r\nZugegebenermaßen bin ich mittel sehr aufgeregt, den Platz zu wechseln.\r\nIch freue mich auf eine Antwort von euch.\r\n\r\nLiebste Grüße aus Schwerin\r\n\r\nJulia Schneider"
