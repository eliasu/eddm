deine_nachricht: "Hallo liebes Ein Ding der Möglichkeit‑Team,\r\n\r\nwir von zukunft zwei planen ein Retreat mit 12 Personen vom 3.–6. Mai und möchten gerne anfragen, ob ihr in diesem Zeitraum noch Kapazitäten für uns habt. 3 Doppel und 6 Einzelzimmer wäre optimal- wir sind aber auch flexibel, was andere Konstellationen angeht. Über die Schlafzimmer hinaus bräuchten wir täglich auch einen Workshop-Raum, in dem wir zu 12. gut sein können.\r\n\r\n\r\nWir würden gerne mit Selbstverpflegung anreisen und wären dankbar, wenn ihr uns eine erste Kostenschätzung für den Aufenthalt (Unterkunft & Raumnutzung)  zukommen lassen könntet.\r\n \r\nMeldet euch gerne, wenn ihr Fragen zur Anfrage habt.\r\n \r\nVielen Dank im Voraus für eure Rückmeldung.\r\n \r\nHerzliche Grüße\r\nZiwei Huang"
