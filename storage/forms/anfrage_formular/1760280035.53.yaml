deine_nachricht: "Hallo,\r\n\r\nwir sind an einer Buchung von ziemlich vielen Zimmern/Appartments, den Tinywägen und ein paar Zeltplätzen (insbesonder von Sa auf So, für Fr auf Sa evt. 50% davon) für eine Geburtstagsfeier im Sommer 2026 interessiert. Wenn ein paar einzelne Unterkünfte schon anderweitig vergeben wären, wäre das bestimmt auch ok, mit unseren Gästen (aus HH, Nds und BaWü) müssten wir sowieso klären, wer für Zelten zu haben ist. Dazu einen Festraum (Freiraum oder Kulturscheune, wir würden uns das vorher nochmals bei Euch anschauen).\r\n\r\nWir kennen das Anwesen aus den frühen 2000-er-Jahren, als wie als Greenpeace energy-Beschäftigte zu vielerlei Gelegenheit bei Heinz Laing und Johannes zu Gast waren (zu Castor-Transporten, kultureller Landpartie, Öxpo...).\r\n\r\nSollte am 26. bis 28.06.2026 oder 03. bis 05.07.2026 noch eine Buchung storniert werden, wäre eines der beiden Wochenenden sogar unsere bevorzugten Termine.\r\n\r\nWir würden uns freuen von Euch zu hören, wie ihr die Möglichkeiten seht.\r\n\r\nViele Grüße\r\nChristof Fleischmann"
