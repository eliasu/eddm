deine_nachricht: "Guten Tag, ich würde gerne Ihr Haus für den genannten Zeitraum vorreservieren. Wir veranstalten Ende Juli, beginnend ab Freitag Mittag und endend am Sonntagmittag, eine Treffen mit unseren Partnern, das sind (Bio-)Saatgutvermehrer und -züchter und besuchen deren Betriebe. Einer von ihnen ist die Gärtnerei Marlin. Robert Godeffroy hatte uns im Vorgespräch an Euch verwiesen. - Wir benötigen vom 24. - 26.7. Vollverpflegung sowie Schlafplätze, die größtenteils auch im Freien, also auf dem Campingplatz sein können. - Alles weitere vielleicht Anfang Januar. Ich freue mich auf einen Rückruf!\r\nLiebe Grüße, Andreas"
