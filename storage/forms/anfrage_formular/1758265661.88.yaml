deine_nachricht: "Hallo aus Hamburg, durch Zufall bin ich auf Euren Ort gestossen und möchte mich erkundigen, wie es mit Vermietungen für workshops läuft. \r\nWir - mein Mann und ich - arbeiten mit der Verbindung von Körper und Klang. Bewegung, Bewegt werden und möchten nächstes Jahr gerne mit workshops in der Nähe von Hamburg starten - wir planen zum einen verlängerte Wochenenden und zum anderen Intensivwochen. Wie sind Eure Konditionen, ist Verpflegung inklusive, ab wieviel Personen bis wieviele … würde mich sehr über Infos freuen und über uns könnt Ihr über die Seite www.somasona.de erfahren. herzlichen Gruß Edith"
