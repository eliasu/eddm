deine_nachricht: "Liebes Team von Ein Ding der Möglichkeiten, \r\n\r\nSehr gern möchten wir unser The People Network Offsite im März 2026 bei Euch durchführen. Wir sind ein Netzwerk von freiberuflichen Trainer:innen und Coaches. \r\n\r\nVermutlich reisen die meisten am Vorabend (18. März) an, am Samstag enden wir mit dem Mittagessen. Je nach Zahl der Teilnehmenden könnte der Freiraum oder Weitblick passen. Für die Unterkunft würden wir in EZ sowie DZ übernachten. Bzgl. Verpflegung gern vegan/vegetarisch. Könntet Ihr uns ein Angebot zukommen lassen. \r\n\r\nDanke & herzlich grüßt, Katja"
