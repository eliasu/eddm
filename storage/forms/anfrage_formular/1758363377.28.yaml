deine_nachricht: "Hallo! \r\n\r\nMein Verlobter und ich möchten nächstes Jahr heiraten - idealerweise an einem Wochenende zwischen Ende August und Anfang September. Dafür möchten wir 2 Tage (Freitag Abend - Sonntag) mit unseren Freunden an einem Ort im Umland von Berlin verbringen, an dem alle unterkommen können. Bei der Suche bin ich auf euer tolles Projekt gestoßen und habe festgestellt, dass es genau das ist, was wir suchen. Wäre es denn möglich, so etwas bei euch umzusetzen (wir wollen eine freie Trauung und alles eher entspannt halten, aber eine kleine Party mit Musik müsste schon drin sein)? Sagt mir gerne Bescheid, ob, wie, wann und zu welchen Konditionen das möglich wäre. Ich freue mich auf eure Rückmeldung!\r\n\r\nLiebe Grüße, Karla"
