deine_nachricht: "Halli Hallo!\r\nIch bin derzeit auf der Suche nach einem schönen Ort für unser erstes Retreat das wir gerne durchführen möchten und bin auf Euren tollen Hof gestoßen, der mich gleich direkt angesprochen hat. Jetzt die Frage ob es ein Ding der Möglichkeit ist, dass wir zu diesem Zeitpunkt bei Euch Unterschlupf finden :) Wir sind 20 Teilnehmende und 7 Personen Team, wir haben eine Köchin mit dabei und würden uns gerne selbst versorgen wenn möglich. In Eurem Kalender steht der Termin auf Anfrage. Was wir brauchen sind natürlich entsprechend Zimmer, einen Aufenthaltsraum für die Zeiten dazwischen und falls das Wetter richtig doof sein sollte und einen Raum der groß genug ist für unsere Aktivitäten wie Breathwork & Schamanische Rituale. Was mir wichtig ist mitzuteilen ist, dass wir tiefe Prozessarbeit machen und es durchaus lauter werden kann, zudem brauchen wir einen geschützten Ort in dem wir auch über Nacht Musik mit Gitarre spielen und singen können und sich dadurch niemand gestört fühlt. Ich würde mich sehr über eine positive Rückmeldung Eurerseits freuen. Viele liebe Grüße, Verena."
