deine_nachricht: "Guten Tag,\r\nich bin Klassenlehrerin einer 11. Klasse, die sich gerade neu zusammengefunden hat.\r\nDaher suche ich ein wetterfestes Tagesangebot (ca. 8 bis 14 oder 9 bis 15 Uhr), bei dem die SuS (ca. 25) gemeinsam etwas erleben und sich kennenlernen können. \r\nMögliche Termine sind der 2.10. oder der 30.10. Ideal wäre es, wenn am selben Termin auch die beiden Parallelklassen ein Angebot wahrnehmen könnten. Aber das ist vielleicht ein bisschen viel verlangt :-)\r\nÜber Ihre Ideen freue ich mich und stehe für Rückfragen gerne zur Verfügung.\r\n\r\nMit besten Grüßen\r\nBettina Fichtner"
