deine_nachricht: "Guten Tag,\r\nWir würden gerne mit drei Erwachsenen und einem Hund  am Freitag, den 22.05. anreisen und bis Montag, den 25.05. bleiben. Dafür würden wir gern einen Stellplatz für unseren kleinen T3 Bulli reservieren (eine Person) und für zwei Personen jeweils einen Zeltplatz auf der Zeltwiese reservieren. \r\nWäre es möglich auf der Zeltwiese einen Hund dabei zu haben ? \r\nWäre der Bulliplatz unmittel angrenzend zu den Zeltplätzen?\r\nSollen wir die Buchung über das online Portal vornehmen und dort drei Zeltplätze buchen ?\r\n\r\nWir freuen uns auf Ihre Auskunft.\r\nEs grüßt Sie herzlich,\r\nElisa Mand"
